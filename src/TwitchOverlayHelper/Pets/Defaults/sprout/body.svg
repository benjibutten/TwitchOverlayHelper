<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Sprout. Klassnamnen driver animationerna: .eye blinkar, .glow pulsar,
       .arm-left/.arm-right är bladen som svingar och vinkar, .leg-a/.leg-b tar steg. -->
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EC" /><stop offset="1" stop-color="#EDDFC2" />
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94E68C" /><stop offset="1" stop-color="#3FA34D" />
    </linearGradient>
  </defs>
  <path class="arm-left" d="M49 22 C40 12 26 12 22 20 C30 26 42 27 49 22 Z" fill="url(#leaf)" stroke="#2E7A3A" stroke-width="2" />
  <path class="arm-right" d="M51 22 C60 12 74 12 78 20 C70 26 58 27 51 22 Z" fill="url(#leaf)" stroke="#2E7A3A" stroke-width="2" />
  <path d="M50 40 C50 34 50 28 50 21" stroke="#3FA34D" stroke-width="3.6" fill="none" stroke-linecap="round" />
  <g class="leg-a">
    <rect x="36" y="82" width="9" height="10" rx="4" fill="url(#cream)" stroke="#6B5A33" stroke-width="2.2" />
    <ellipse cx="40.5" cy="93" rx="7" ry="3.2" fill="#6B5A33" />
  </g>
  <g class="leg-b">
    <rect x="55" y="82" width="9" height="10" rx="4" fill="url(#cream)" stroke="#6B5A33" stroke-width="2.2" />
    <ellipse cx="59.5" cy="93" rx="7" ry="3.2" fill="#6B5A33" />
  </g>
  <rect x="29" y="40" width="42" height="45" rx="17" fill="url(#cream)" stroke="#6B5A33" stroke-width="2.5" />
  <ellipse cx="40" cy="50" rx="6" ry="8" fill="#fff" opacity="0.55" transform="rotate(-14 40 50)" />
  <circle class="eye" cx="42" cy="60" r="3.6" fill="#4A3B1E" />
  <circle class="eye" cx="58" cy="60" r="3.6" fill="#4A3B1E" />
  <path d="M45 69 Q50 73 55 69" stroke="#4A3B1E" stroke-width="2.4" fill="none" stroke-linecap="round" />
  <circle cx="35" cy="66" r="3" fill="#FF9FB2" opacity="0.8" />
  <circle cx="65" cy="66" r="3" fill="#FF9FB2" opacity="0.8" />
  <circle class="glow" cx="50" cy="79" r="2.6" fill="var(--accent)" opacity="0.9" />
</svg>
