<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<title>Pets</title>
<style>
  /* Transparent everywhere: this page sits as an OBS browser source over the game. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  * { box-sizing: border-box; user-select: none; }

  #stage { position: fixed; inset: 0; --pet-scale: 1; }
  #stage.disabled { display: none; }
  #stage.hide-names .name { display: none; }

  .pet {
    position: absolute;
    bottom: 4px;
    left: 0;
    width: calc(90px * var(--pet-scale));
    will-change: transform;
    text-align: center;
    --accent: #7EF0FF;
  }

  .pet .body-wrap {
    position: relative;
    width: calc(90px * var(--pet-scale));
    height: calc(90px * var(--pet-scale));
    animation: bob 2.6s ease-in-out infinite;
  }
  .pet.face-left .body-wrap svg { transform: scaleX(-1); }

  .pet svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* SVG part animations need their own origin, not the SVG canvas corner. */
  .pet svg * { transform-box: fill-box; }

  /* The soft ground shadow lives outside .body-wrap so it stays put when the body jumps. */
  .pet .shadow {
    position: absolute;
    left: 14%;
    width: 72%;
    height: calc(10px * var(--pet-scale));
    top: calc(85px * var(--pet-scale));
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.38) 0%, rgba(0,0,0,0) 68%);
  }

  .eye { transform-origin: center; animation: blink 4.2s infinite; }
  .glow { transform-origin: center; animation: glow 2.2s ease-in-out infinite; }
  .arm-left, .arm-right, .leg-a, .leg-b { transform-origin: top center; }
  .flame { transform-origin: bottom center; animation: flameSway 0.9s ease-in-out infinite alternate; }
  .glitch { animation: glitch 1.7s steps(2, jump-none) infinite; }

  /* Pets in the hatch-pet spritesheet format: 8 columns of 192×208 cells, 9 rows in version 1
     and 11 in version 2 (the two extra rows hold look directions). With the background scaled to
     800% × rows·100%, percentage steps land exactly on cell edges; pets.js sets the vertical
     size per species, the 900% here is only the till-then default. */
  .pet .sprite {
    position: relative;
    width: calc(90px * var(--pet-scale));
    height: calc(97.5px * var(--pet-scale));
    background-repeat: no-repeat;
    background-size: 800% 900%;
    background-position: 0% 0%;
  }
  .pet.is-sprite .body-wrap { height: calc(97.5px * var(--pet-scale)); }
  .pet.is-sprite .shadow { top: calc(92px * var(--pet-scale)); }

  .name {
    display: inline-block;
    margin-top: 2px;
    max-width: calc(160px * var(--pet-scale));
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font: 600 calc(12px * var(--pet-scale))/1.5 "Segoe UI", Verdana, sans-serif;
    color: #fff;
    background: linear-gradient(180deg, rgba(23, 27, 40, 0.78), rgba(10, 12, 20, 0.78));
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    padding: 0 calc(9px * var(--pet-scale));
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .name::before {
    content: "";
    display: inline-block;
    width: calc(6px * var(--pet-scale));
    height: calc(6px * var(--pet-scale));
    border-radius: 50%;
    background: var(--accent);
    margin-right: calc(5px * var(--pet-scale));
    vertical-align: middle;
  }

  .bubble {
    position: absolute;
    left: 50%;
    top: calc(-26px * var(--pet-scale));
    transform: translateX(-50%);
    font-size: calc(20px * var(--pet-scale));
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  .bubble.show { animation: bubblePop 1.6s ease-out forwards; }

  /* ------------------------------------------------------------ behaviors */
  .pet.walk .body-wrap { animation: walkBob 0.34s ease-in-out infinite; }
  .pet.walk .leg-a { animation: legSwing 0.34s ease-in-out infinite; }
  .pet.walk .leg-b { animation: legSwing 0.34s ease-in-out infinite reverse; }
  .pet.walk .arm-left { animation: armSwing 0.34s ease-in-out infinite reverse; }
  .pet.walk .arm-right { animation: armSwing 0.34s ease-in-out infinite; }

  .pet.wave .arm-right { animation: wave 0.5s ease-in-out 3; }
  .pet.jump .body-wrap { animation: jump 0.65s cubic-bezier(.3,0,.2,1); }
  .pet.jump .shadow { animation: shadowShrink 0.65s cubic-bezier(.3,0,.2,1); }
  .pet.dance .body-wrap { animation: dance 0.45s ease-in-out 3; }

  .pet.sleep .eye { animation: none; transform: scaleY(0.12); }
  .pet.sleep .body-wrap { animation: bob 3.8s ease-in-out infinite; }

  .pet.fight .body-wrap { animation: lunge 0.28s ease-in-out infinite alternate; }
  .pet.cook .body-wrap { animation: stir 0.7s ease-in-out infinite; }
  .pet.cook .arm-right { animation: armSwing 0.7s ease-in-out infinite; }
  .pet.lean-right .body-wrap { animation: none; transform: rotate(10deg) translateY(2px); }
  .pet.lean-left .body-wrap { animation: none; transform: rotate(-10deg) translateY(2px); }
  /* Losing a fight: sprite pets show their "failed" row, drawn pets slump instead. Declared after
     .walk on purpose, so the slump wins while the loser trudges away. */
  .pet.sad .body-wrap { animation: sadSlump 1.9s ease-in-out; }

  .pet.spawn { animation: dropIn 0.9s cubic-bezier(.25,1.4,.45,1); }
  .pet.despawn { animation: beamOut 0.9s ease-in forwards; }

  .prop {
    position: absolute;
    bottom: 2px;
    font-size: calc(30px * var(--pet-scale));
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.6));
    animation: dropIn 0.5s ease-out;
  }

  .float {
    position: absolute;
    font-size: calc(17px * var(--pet-scale));
    pointer-events: none;
    animation: floatUp 1.4s ease-out forwards;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
  }

  /* ------------------------------------------------------------ lyckosnurren

     A reel of portraits that slides in from a configurable edge, loops through everything winnable
     and lands on the winner. Sized against --pet-scale like the pets themselves, so it stays a
     corner of the overlay rather than taking the screen. */
  .spin {
    position: absolute;
    width: calc(150px * var(--pet-scale));
    padding: calc(10px * var(--pet-scale)) calc(10px * var(--pet-scale)) calc(12px * var(--pet-scale));
    border-radius: calc(18px * var(--pet-scale));
    background: linear-gradient(165deg, rgba(28, 33, 51, 0.93), rgba(12, 14, 24, 0.95));
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    text-align: center;
    opacity: 0;
    /* Slower coming back than going out: the entrance is the part anyone is watching. */
    transition: transform 0.65s cubic-bezier(.18,.9,.28,1.08), opacity 0.45s ease;
    will-change: transform, opacity;
  }
  /* Each edge parks the panel just outside its own side and centres it on the other axis. */
  .spin.from-right { right: calc(16px * var(--pet-scale)); top: 50%; margin-top: calc(-118px * var(--pet-scale)); transform: translateX(150%); }
  .spin.from-left { left: calc(16px * var(--pet-scale)); top: 50%; margin-top: calc(-118px * var(--pet-scale)); transform: translateX(-150%); }
  .spin.from-top { top: calc(16px * var(--pet-scale)); left: 50%; margin-left: calc(-75px * var(--pet-scale)); transform: translateY(-150%); }
  .spin.from-bottom { bottom: calc(16px * var(--pet-scale)); left: 50%; margin-left: calc(-75px * var(--pet-scale)); transform: translateY(150%); }

  /* After the side rules, and deliberately: they carry the same specificity, so the one that comes
     last is the one that decides where the panel actually sits. */
  .spin.in { opacity: 1; transform: translate(0, 0); }

  .spin-title {
    font: 700 calc(12px * var(--pet-scale))/1.4 "Segoe UI", Verdana, sans-serif;
    letter-spacing: calc(0.6px * var(--pet-scale));
    text-transform: uppercase;
    color: #fff;
    margin-bottom: calc(7px * var(--pet-scale));
    text-shadow: 0 0 calc(10px * var(--pet-scale)) rgba(126, 240, 255, 0.55);
  }

  /* The window the reel runs behind. One cell tall, so exactly one portrait shows at a time. */
  .spin-window {
    position: relative;
    height: calc(112px * var(--pet-scale));
    border-radius: calc(12px * var(--pet-scale));
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 120%, rgba(126, 240, 255, 0.16), rgba(0, 0, 0, 0.34) 70%);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .spin-cell {
    height: calc(112px * var(--pet-scale));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spin-art { width: calc(92px * var(--pet-scale)); height: calc(100px * var(--pet-scale)); }
  .spin-art svg { width: 100%; height: 100%; display: block; }
  .sprite-portrait { background-repeat: no-repeat; }

  /* A moving sheen while the reel runs, and the soft edges that sell the loop as endless. */
  .spin-glare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(8, 10, 18, 0.85) 0%, rgba(8, 10, 18, 0) 26%, rgba(8, 10, 18, 0) 74%, rgba(8, 10, 18, 0.85) 100%);
  }
  .spin.spinning .spin-glare::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, 0.26) 50%, transparent 62%);
    animation: spinSheen 0.85s linear infinite;
  }

  /* The line the winner comes to rest on. */
  .spin-marker {
    position: absolute;
    left: calc(6px * var(--pet-scale));
    right: calc(6px * var(--pet-scale));
    top: 50%;
    height: calc(2px * var(--pet-scale));
    transform: translateY(-50%);
    background: linear-gradient(90deg, transparent, rgba(126, 240, 255, 0.85), transparent);
    opacity: 0.5;
    pointer-events: none;
  }
  .spin.landed .spin-marker { opacity: 0; }
  .spin.landed .spin-window { animation: spinLand 0.75s cubic-bezier(.2,1.5,.4,1); }
  .spin.landed.is-win .spin-window { box-shadow: 0 0 calc(22px * var(--pet-scale)) rgba(255, 209, 102, 0.75); }
  .spin.landed.is-duplicate .spin-window { box-shadow: 0 0 calc(18px * var(--pet-scale)) rgba(126, 240, 255, 0.6); }

  .spin-winner {
    margin-top: calc(8px * var(--pet-scale));
    min-height: calc(15px * var(--pet-scale));
    font: 700 calc(12px * var(--pet-scale))/1.3 "Segoe UI", Verdana, sans-serif;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    opacity: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spin.landed .spin-winner { animation: spinName 0.6s ease-out forwards; }

  .spin-confetti {
    position: absolute;
    top: calc(38px * var(--pet-scale));
    width: calc(6px * var(--pet-scale));
    height: calc(9px * var(--pet-scale));
    border-radius: calc(1px * var(--pet-scale));
    opacity: 0;
    pointer-events: none;
    animation: spinConfetti 1.5s ease-out forwards;
  }

  /* ------------------------------------------------------------ sällsynthet

     How rare a pet is, told with light instead of a label: a halo in the tier's colour behind the
     creature, and for the two rarest a sheen that sweeps across its own silhouette. Common pets are
     deliberately left plain – an effect everyone wears is one nobody notices – and everything here
     hangs off #stage.rarity-fx, so the checkbox in the app takes all of it away at once.

     The sheen is masked with the pet's own spritesheet, at the very cell pets.js is showing this
     frame, so the light lands on the creature and not on the transparent square around it. SVG pets
     have no image to mask with and brighten in the same rhythm instead. */
  /* How much of the whole flourish is showing. Everything below multiplies its opacity by this one
     number, so the fade after a pet's entrance is a single transition rather than one per effect –
     and a browser too old to register the property still reads it as a plain 1 or 0, losing the
     transition and nothing else. */
  @property --rarity-fade {
    syntax: "<number>";
    initial-value: 1;
    inherits: true;
  }

  .pet { --rarity: #7EF0FF; --rarity-rgb: 126, 240, 255; --aura-peak: 0; --rarity-fade: 1; transition: --rarity-fade 2.2s ease-in; }
  .pet.rarity-uncommon { --rarity: #7CE7A6; --rarity-rgb: 124, 231, 166; --aura-peak: 0.38; }
  .pet.rarity-rare { --rarity: #B98CFF; --rarity-rgb: 185, 140, 255; --aura-peak: 0.5; }
  .pet.rarity-legendary { --rarity: #FFD166; --rarity-rgb: 255, 209, 102; --aura-peak: 0.62; }
  .pet.rarity-faded { --rarity-fade: 0; }

  .pet .aura, .pet .spark { display: none; }

  #stage.rarity-fx .pet.rarity-uncommon .aura,
  #stage.rarity-fx .pet.rarity-rare .aura,
  #stage.rarity-fx .pet.rarity-legendary .aura {
    display: block;
    position: absolute;
    left: 50%;
    top: calc(8px * var(--pet-scale));
    width: calc(94px * var(--pet-scale));
    height: calc(94px * var(--pet-scale));
    border-radius: 50%;
    /* A ring rather than a disc: a filled halo hides behind the creature standing on top of it,
       and only its rim ever reaches daylight anyway. */
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 26%, var(--rarity) 50%, rgba(0,0,0,0) 72%);
    filter: blur(calc(5px * var(--pet-scale)));
    pointer-events: none;
    animation: auraBreath 3.4s ease-in-out infinite;
  }

  /* A rim of the tier's colour along the drawing's own edge – what makes the aura read as the pet
     glowing rather than as a lamp standing behind it. */
  #stage.rarity-fx .pet.rarity-uncommon .body-wrap {
    filter: drop-shadow(0 0 calc(2px * var(--pet-scale)) rgba(var(--rarity-rgb), var(--rarity-fade)));
  }
  #stage.rarity-fx .pet.rarity-rare .body-wrap,
  #stage.rarity-fx .pet.rarity-legendary .body-wrap {
    filter: drop-shadow(0 0 calc(3px * var(--pet-scale)) rgba(var(--rarity-rgb), var(--rarity-fade)));
  }

  #stage.rarity-fx .pet.rarity-rare .sprite::after,
  #stage.rarity-fx .pet.rarity-legendary .sprite::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(112deg,
      rgba(255,255,255,0) 36%, rgba(255,255,255,0.36) 45%, rgba(255,255,255,0.78) 50%,
      rgba(255,255,255,0.36) 55%, rgba(255,255,255,0) 64%);
    background-size: 300% 100%;
    background-repeat: no-repeat;
    -webkit-mask-image: var(--sprite-mask); mask-image: var(--sprite-mask);
    -webkit-mask-size: var(--sprite-size); mask-size: var(--sprite-size);
    -webkit-mask-position: var(--sprite-pos); mask-position: var(--sprite-pos);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    animation: sheen 6.4s ease-in-out infinite;
  }
  #stage.rarity-fx .pet.rarity-legendary .sprite::after { animation-duration: 4.8s; }

  #stage.rarity-fx .pet.rarity-rare .body-wrap svg,
  #stage.rarity-fx .pet.rarity-legendary .body-wrap svg { animation: svgSheen 6.4s ease-in-out infinite; }
  #stage.rarity-fx .pet.rarity-legendary .body-wrap svg { animation-duration: 4.8s; }

  /* Legendaries alone get motes drifting off them, and a warmer patch of ground. */
  #stage.rarity-fx .pet.rarity-legendary .spark {
    display: block;
    position: absolute;
    top: calc(74px * var(--pet-scale));
    width: calc(4px * var(--pet-scale));
    height: calc(4px * var(--pet-scale));
    border-radius: 50%;
    /* A white core inside the tier's colour: a mote the same gold as the aura it rises through is
       one nobody sees. */
    background: #fff;
    box-shadow: 0 0 calc(7px * var(--pet-scale)) calc(1px * var(--pet-scale)) var(--rarity);
    opacity: 0;
    pointer-events: none;
    animation: sparkRise 3.2s ease-out infinite;
  }
  #stage.rarity-fx .pet.rarity-legendary .spark:first-of-type { left: 6%; }
  #stage.rarity-fx .pet.rarity-legendary .spark:last-of-type { left: 84%; animation-delay: 1.6s; }
  #stage.rarity-fx .pet.rarity-legendary .shadow::after {
    content: "";
    position: absolute;
    inset: -40% -8%;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255, 209, 102, 0.42), rgba(0,0,0,0) 70%);
    animation: groundBreath 3.4s ease-in-out infinite;
  }

  /* The same tiers in the reel, where a legendary going past is the whole point of watching. */
  #stage.rarity-fx .spin-cell.rarity-uncommon { --rarity-soft: rgba(124, 231, 166, 0.26); }
  #stage.rarity-fx .spin-cell.rarity-rare { --rarity-soft: rgba(185, 140, 255, 0.34); }
  #stage.rarity-fx .spin-cell.rarity-legendary { --rarity-soft: rgba(255, 209, 102, 0.40); }
  #stage.rarity-fx .spin-cell.rarity-uncommon,
  #stage.rarity-fx .spin-cell.rarity-rare,
  #stage.rarity-fx .spin-cell.rarity-legendary {
    background: radial-gradient(ellipse at 50% 55%, var(--rarity-soft), rgba(0,0,0,0) 68%);
  }
  #stage.rarity-fx .spin.landed.is-win.rarity-uncommon .spin-window { box-shadow: 0 0 calc(22px * var(--pet-scale)) rgba(124, 231, 166, 0.7); }
  #stage.rarity-fx .spin.landed.is-win.rarity-rare .spin-window { box-shadow: 0 0 calc(24px * var(--pet-scale)) rgba(185, 140, 255, 0.75); }
  #stage.rarity-fx .spin.landed.is-win.rarity-legendary .spin-window { box-shadow: 0 0 calc(30px * var(--pet-scale)) rgba(255, 209, 102, 0.9); }

  /* ------------------------------------------------------------ keyframes */
  @keyframes auraBreath {
    0%, 100% { opacity: calc(var(--aura-peak) * 0.5 * var(--rarity-fade)); transform: translateX(-50%) scale(0.94); }
    50% { opacity: calc(var(--aura-peak) * var(--rarity-fade)); transform: translateX(-50%) scale(1.05); }
  }
  @keyframes groundBreath {
    0%, 100% { opacity: calc(0.5 * var(--rarity-fade)); transform: scale(0.94); }
    50% { opacity: var(--rarity-fade); transform: scale(1.05); }
  }
  @keyframes sheen {
    0%, 62% { background-position: 130% 0; opacity: 0; }
    68% { opacity: var(--rarity-fade); }
    88% { opacity: var(--rarity-fade); }
    94%, 100% { background-position: -30% 0; opacity: 0; }
  }
  @keyframes svgSheen {
    0%, 62%, 100% { filter: brightness(1) saturate(1); }
    78% { filter: brightness(calc(1 + 0.4 * var(--rarity-fade))) saturate(calc(1 + 0.15 * var(--rarity-fade))); }
  }
  @keyframes sparkRise {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    18% { opacity: calc(0.95 * var(--rarity-fade)); }
    100% { opacity: 0; transform: translateY(calc(-52px * var(--pet-scale))) scale(1.1); }
  }
  @keyframes spinSheen { 0% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
  @keyframes spinLand { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.07); } }
  @keyframes spinName { 0% { opacity: 0; transform: translateY(calc(6px * var(--pet-scale))); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes spinConfetti {
    0% { opacity: 0; transform: translate(0, 0) rotate(0); }
    12% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--drift), calc(120px * var(--pet-scale))) rotate(var(--spin)); }
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(calc(-2px * var(--pet-scale))); } }
  @keyframes walkBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(calc(-4px * var(--pet-scale))); } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95%, 98% { transform: scaleY(0.08); } }
  @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes flameSway { 0% { transform: skewX(-3deg) scaleY(0.98); } 100% { transform: skewX(3deg) scaleY(1.04); } }
  @keyframes glitch { 0%, 78% { opacity: 0.75; } 79%, 88% { opacity: 0.15; } 89%, 100% { opacity: 0.55; } }
  @keyframes legSwing { 0%,100% { transform: rotate(14deg); } 50% { transform: rotate(-14deg); } }
  @keyframes armSwing { 0%,100% { transform: rotate(10deg); } 50% { transform: rotate(-14deg); } }
  @keyframes wave { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-130deg); } }
  @keyframes jump { 0%,100% { transform: translateY(0); } 40% { transform: translateY(calc(-34px * var(--pet-scale))); } 70% { transform: translateY(0); } 85% { transform: translateY(calc(-8px * var(--pet-scale))); } }
  @keyframes shadowShrink { 0%,100% { transform: scale(1); opacity: 1; } 40% { transform: scale(0.55); opacity: 0.5; } 70% { transform: scale(1); } }
  @keyframes dance { 0%,100% { transform: rotate(-9deg) translateY(0); } 50% { transform: rotate(9deg) translateY(calc(-5px * var(--pet-scale))); } }
  @keyframes lunge { 0% { transform: translateX(calc(-3px * var(--pet-scale))) rotate(-7deg); } 100% { transform: translateX(calc(4px * var(--pet-scale))) rotate(7deg); } }
  @keyframes stir { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(calc(-3px * var(--pet-scale))) rotate(3deg); } }
  @keyframes sadSlump { 0%,100% { transform: translateY(0) rotate(0); } 25%,65% { transform: translateY(calc(4px * var(--pet-scale))) rotate(-5deg); } 45%,85% { transform: translateY(calc(3px * var(--pet-scale))) rotate(3deg); } }
  @keyframes dropIn { 0% { transform: translateY(calc(-140px * var(--pet-scale))) scale(0.6); opacity: 0; } 60% { opacity: 1; } 80% { transform: translateY(calc(4px * var(--pet-scale))) scale(1.04); } 100% { transform: translateY(0) scale(1); } }
  @keyframes beamOut { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(calc(-60px * var(--pet-scale))) scale(0.2); opacity: 0; } }
  @keyframes bubblePop { 0% { opacity: 0; transform: translateX(-50%) translateY(6px) scale(0.6); } 15% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.1); } 30% { transform: translateX(-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(0.7); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(calc(-46px * var(--pet-scale))) scale(1.15); } }
</style>
</head>
<body>
  <!-- Every pet brings its own gradients in its body.svg; nothing about a species is defined here,
       so a pet can be changed with a text editor without touching the overlay. -->
  <div id="stage"></div>
