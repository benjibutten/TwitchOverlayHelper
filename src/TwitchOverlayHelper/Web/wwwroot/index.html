<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatt</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <span id="statusDot" class="dot" data-state="idle"></span>
  <span id="statusText" class="bar-status">Ansluter …</span>
  <div class="bar-actions">
    <button id="pauseBtn" class="icon-btn" type="button" title="Pausa chatten" aria-label="Pausa chatten">⏸</button>
    <button id="refreshBtn" class="icon-btn" type="button" title="Ladda om chatten" aria-label="Ladda om chatten">⟳</button>
    <button id="nickBtn" class="icon-btn" type="button" title="Smeknamn" aria-label="Smeknamn">🏷</button>
    <button id="raidBtn" class="icon-btn" type="button" title="Raida en kanal" aria-label="Raida en kanal" hidden>📡</button>
  </div>
</header>

<!-- A hype train runs for minutes, so it gets a shelf of its own above the column rather than a
     card that the next twenty messages would push out of sight. -->
<section id="hype" class="hype" hidden aria-label="Hypetåg">
  <div class="hype-head">
    <span class="hype-icon" aria-hidden="true">🚂</span>
    <span id="hypeHeadline" class="hype-headline"></span>
    <span id="hypeDetail" class="hype-detail"></span>
  </div>
  <div id="hypeBar" class="hype-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" hidden>
    <div id="hypeFill" class="hype-fill"></div>
  </div>
  <div id="hypeTop" class="hype-top"></div>
</section>

<section id="pinned" class="pinned" hidden aria-label="Fastnålade meddelanden"></section>

<main id="chat" class="chat" role="log" aria-live="polite" aria-label="Chatt"></main>

<button id="jumpBtn" class="jump" type="button" hidden>↓ <span id="jumpCount">0</span> nya</button>

<form id="composer" class="composer" hidden>
  <!-- Both panels hang above the field rather than below it: the field sits at the bottom edge of
       the dock, and a list opening downwards would have nowhere to go. -->
  <div id="mentionList" class="suggest" role="listbox" aria-label="Chattare att nämna" hidden></div>

  <div id="emotePanel" class="emote-panel" hidden aria-label="Emotes">
    <input id="emoteSearch" class="field emote-search" type="search" placeholder="Sök emote …" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="emoteBody" class="emote-body"></div>
    <p id="emoteNote" class="emote-note" hidden></p>
  </div>

  <!-- Editable markup rather than an input: an emote is a picture, and a text field can only ever
       hold its name. What is typed here is still only ever text and images – see composerText(). -->
  <div id="composerInput" class="composer-input" contenteditable="true" role="textbox"
       aria-multiline="false" aria-label="Skriv ett meddelande" data-empty="true"
       data-placeholder="Skriv ett meddelande …"
       autocorrect="off" autocapitalize="off" spellcheck="false"></div>
  <button id="emoteBtn" class="icon-btn composer-emote" type="button" title="Emotes" aria-label="Emotes"
          aria-expanded="false">🙂</button>
  <button id="composerSend" class="composer-send" type="submit" title="Skicka">Skicka</button>
</form>

<div id="toast" class="toast" hidden>
  <span id="toastText"></span>
  <button id="toastAction" class="toast-action" type="button" hidden></button>
</div>

<!-- Bottom sheet for moderation actions on one chatter. -->
<div id="userSheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <div class="sheet-head">
      <span id="sheetName" class="sheet-name"></span>
      <button class="sheet-close icon-btn" type="button" data-close="userSheet" aria-label="Stäng">✕</button>
    </div>
    <p id="sheetQuote" class="sheet-quote"></p>
    <!-- Pinning a line to the strip above and naming a chatter both change nothing on Twitch and
         are seen by nobody else, so they are offered whether or not anyone is logged in – unlike
         the moderation row below. -->
    <div class="sheet-reading">
      <button id="sheetPin" class="action" type="button">📌 Nåla fast här</button>
      <button id="sheetNick" class="action" type="button">🏷 Sätt smeknamn</button>
    </div>
    <div id="sheetActions" class="sheet-actions">
      <button id="sheetPinChat" class="action" type="button" data-act="pinChat">📌 Nåla fast för tittarna</button>
      <button class="action" type="button" data-act="timeout" data-seconds="60">⏱ 1 minut</button>
      <button class="action" type="button" data-act="timeout" data-seconds="600">⏱ 10 minuter</button>
      <button class="action" type="button" data-act="timeout" data-seconds="3600">⏱ 1 timme</button>
      <button id="sheetDelete" class="action" type="button" data-act="delete">🗑 Ta bort meddelandet</button>
      <button class="action action-danger" type="button" data-act="ban">🚫 Banna för alltid</button>
      <button class="action action-quiet" type="button" data-act="profile">👤 Öppna profilen</button>
    </div>
    <div id="sheetConfirm" class="sheet-confirm" hidden>
      <p id="sheetConfirmText"></p>
      <div class="sheet-confirm-row">
        <button id="sheetConfirmYes" class="action action-danger" type="button">Ja, banna</button>
        <button id="sheetConfirmNo" class="action action-quiet" type="button">Avbryt</button>
      </div>
    </div>
    <p id="sheetLocked" class="sheet-locked" hidden>Logga in i Twitch Overlay Helper-appen för att kunna moderera.</p>
  </div>
</div>

<!-- Raid picker: channels you follow that are live right now. -->
<div id="raidPanel" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="raidTitle">
    <div class="sheet-head">
      <span id="raidTitle" class="sheet-name">Raida en kanal</span>
      <button class="sheet-close icon-btn" type="button" data-close="raidPanel" aria-label="Stäng">✕</button>
    </div>
    <input id="raidSearch" class="field" type="search" placeholder="Sök bland dina följda kanaler …" autocomplete="off">
    <div id="raidList" class="raid-list"></div>
    <button id="raidCancel" class="action action-quiet" type="button">Avbryt pågående raid</button>
  </div>
</div>

<!-- Naming one chatter. Its own sheet rather than a field in the user sheet: it is the one thing
     here that is typed rather than pressed, and a text field wants the whole width and the caret. -->
<div id="nickSheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="nickTitle">
    <div class="sheet-head">
      <span id="nickTitle" class="sheet-name">Smeknamn</span>
      <button class="sheet-close icon-btn" type="button" data-close="nickSheet" aria-label="Stäng">✕</button>
    </div>
    <p id="nickFor" class="sheet-quote"></p>
    <form id="nickForm">
      <label class="nick-label" for="nickInput">Visas bredvid namnet i chatten – bara för dig.</label>
      <input id="nickInput" class="field" type="text" maxlength="24" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="T.ex. Kajsa från jobbet">
      <div class="nick-count"><span id="nickCount">0</span>/24</div>
      <div class="sheet-confirm-row">
        <button id="nickSave" class="action" type="submit">💾 Spara</button>
        <button id="nickRemove" class="action action-quiet" type="button" hidden>🗑 Ta bort</button>
      </div>
    </form>
  </div>
</div>

<!-- Every nickname in one place, so a name that was given months ago can be found again without
     waiting for its owner to say something. -->
<div id="nickPanel" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="nickPanelTitle">
    <div class="sheet-head">
      <span id="nickPanelTitle" class="sheet-name">Smeknamn</span>
      <button class="sheet-close icon-btn" type="button" data-close="nickPanel" aria-label="Stäng">✕</button>
    </div>
    <input id="nickSearch" class="field" type="search" placeholder="Sök smeknamn eller användare …" autocomplete="off">
    <div id="nickList" class="nick-list"></div>
    <p class="nick-note">Sparas i appen, med en säkerhetskopia vid varje ändring.</p>
  </div>
</div>

<script src="chat-render.js"></script>
<script src="app.js"></script>
</body>
</html>
