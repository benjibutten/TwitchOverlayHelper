<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Uppläsning</title>
<!-- Two jobs on one source, because they are one thing happening: the sound of a paid reading, and
     the card that says whose words are being said. With the card switched off nothing is drawn at
     all and this stays what it has always been – a 1×1 source that OBS gives a fader of its own.
     With it on, the source is made the size of the scene and the card places itself inside it. -->
<link rel="stylesheet" href="tts.css">
</head>
<body data-widget="false">
<div id="state" data-live="false"></div>
<div class="stage" id="stage" data-position="bottom-center">
  <div class="card" id="card" data-visible="false">
    <div class="label" id="label"></div>
    <div class="head">
      <span class="wave" id="wave" hidden><i></i><i></i><i></i><i></i><i></i></span>
      <span class="name" id="name"></span>
      <span class="cost" id="cost"></span>
    </div>
    <div class="message" id="message"></div>
  </div>
</div>
<script src="tts.js"></script>
</body>
</html>
